name: Deploy terrain viewer to Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publishes web/ only. The dossiers, prices and vendor details in the
      # rest of the repository are deliberately not uploaded.
      # Pages must already be enabled with Source: GitHub Actions. The workflow
      # GITHUB_TOKEN can deploy to Pages but cannot create the Pages site - that
      # needs admin rights, so enablement:true fails with "Resource not
      # accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
